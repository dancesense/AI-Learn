server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: youzhi-linghang
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/youzhi_linghang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: false
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

logging:
  level:
    cn.hollis.llm.youzhi: INFO

app:
  demo-password: ${DEMO_PASSWORD:}

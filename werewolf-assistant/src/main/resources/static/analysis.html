<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>实时分析 - 狼人杀AI助手</title>
  <link rel="stylesheet" href="/assets/styles.css" />
  <style>
    /* ---- 录音转文字区域 ---- */
    .transcript-box {
      background: rgba(2,11,33,0.5);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.8;
    }
    .transcript-item {
      margin-bottom: 6px;
    }
    .transcript-item .speaker-tag {
      font-size: 11px;
      font-weight: 700;
      color: #8aabde;
      margin-right: 4px;
    }
    .transcript-item .text-content {
      color: #dde8ff;
    }
    /* ---- 死亡遮罩 ---- */
    .player-card.dead::after {
      content: "出局";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      font-weight: 900;
      color: rgba(200, 80, 80, 0.6);
      letter-spacing: 2px;
      pointer-events: none;
    }
    /* ---- 投票记录按钮 ---- */
    .vote-add-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .vote-add-select {
      flex: 1;
      min-width: 0;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.06);
      color: #d9e6ff;
      font-size: 13px;
      padding: 0 8px;
    }
    .vote-add-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,180,50,0.5);
      background: rgba(255,180,50,0.1);
      color: #ffbc2d;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      min-height: 36px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    /* ---- Tab 分页 ---- */
    .tab-bar {
      display: flex;
      gap: 0;
      margin-bottom: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      border: 0;
      background: transparent;
      color: #7a96c4;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .tab-btn.active {
      color: #ff7794;
      font-weight: 700;
      background: rgba(255,68,105,0.12);
    }
    .tab-btn.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 25%;
      width: 50%;
      height: 2px;
      background: #ff4469;
      border-radius: 2px;
    }
    /* ---- Tab 内容区 ---- */
    .tab-panel {
      display: none;
    }
    .tab-panel.active {
      display: block;
    }
    /* ---- 玩家卡片网格 ---- */
    .pcard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .pcard {
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(35, 55, 91, 0.7);
      padding: 10px 10px 8px;
      min-height: 120px;
      position: relative;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .pcard:active {
      opacity: 0.85;
      transform: scale(0.97);
    }
    .pcard.is-recording {
      border-color: rgba(255,68,105,0.7);
      box-shadow: 0 0 0 1px rgba(255,80,113,0.25), 0 0 12px rgba(255,80,113,0.12);
    }
    .pcard.is-self {
      border-color: rgba(255,188,45,0.45);
    }
    .pcard.is-dead {
      background: rgba(20,30,50,0.5);
      border-color: rgba(100,120,160,0.2);
      opacity: 0.55;
    }
    .pcard-header {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 4px;
    }
    .pcard-avatar {
      width: 24px; height: 24px;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      display: grid; place-items: center;
      font-size: 11px; font-weight: 700; color: #c8d8f8;
      flex-shrink: 0;
    }
    .pcard.is-recording .pcard-avatar {
      background: rgba(255,80,113,0.2);
      color: #ff7794;
    }
    .pcard-name {
      font-size: 12px; font-weight: 700; color: #ceddf9;
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pcard.is-recording .pcard-name { color: #ff7794; }
    .pcard.is-self .pcard-name { color: #ffbc2d; }
    .pcard-eye {
      width: 28px; height: 28px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.06);
      color: #8aabde; font-size: 13px;
      display: grid; place-items: center;
      cursor: pointer; flex-shrink: 0;
      transition: all 0.15s;
      touch-action: manipulation;
    }
    .pcard-eye:hover { background: rgba(255,255,255,0.12); color: #c8d8f8; }
    .pcard-body {
      font-size: 11px; line-height: 1.45;
      color: #e7f0ff;
      max-height: 42px; overflow: hidden;
      word-break: break-all;
      margin-bottom: 4px;
    }
    .pcard-body.empty { color: var(--subtext); }
    /* 玩家编号高亮 - 红色 */
    .kw-player {
      color: #ff6080;
      font-weight: 700;
    }
    .pcard-tags {
      display: flex; flex-wrap: wrap; gap: 3px;
      margin-bottom: 4px;
    }
    .pcard-tag {
      font-size: 10px; padding: 3px 7px;
      border-radius: 4px; cursor: pointer;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.05);
      color: #9eb3d7;
      transition: all 0.15s;
      user-select: none;
      min-height: 22px;
      touch-action: manipulation;
    }
    .pcard-tag:hover { background: rgba(255,255,255,0.1); }
    .pcard-tag.on-good { background: rgba(37,208,143,0.2); border-color: rgba(37,208,143,0.5); color: #25d08f; }
    .pcard-tag.on-kill { background: rgba(255,68,105,0.2); border-color: rgba(255,68,105,0.5); color: #ff7794; }
    .pcard-tag.on-claim { background: rgba(255,188,45,0.2); border-color: rgba(255,188,45,0.5); color: #ffbc2d; }
    .pcard-tag.on-dead { background: rgba(100,120,160,0.2); border-color: rgba(100,120,160,0.5); color: #718096; }
    .pcard-prob {
      height: 3px; border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden; margin-bottom: 2px;
    }
    .pcard-prob-fill {
      height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, #ff6080, #ffa040);
      transition: width 0.5s ease;
    }
    .pcard-footer {
      display: flex; align-items: center; justify-content: space-between;
    }
    .pcard-prob-text {
      font-size: 9px; color: #8a9cc0;
    }
    .pcard-mic {
      width: 36px; height: 36px;
      border-radius: 10px;
      border: 1.5px solid rgba(255,80,113,0.5);
      background: rgba(255,80,113,0.08);
      color: #ff7794; font-size: 16px;
      display: grid; place-items: center;
      cursor: pointer; padding: 0;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .pcard-mic.on {
      background: rgba(255,80,113,0.3);
      border-color: rgba(255,80,113,0.9);
      color: #ff4469;
      box-shadow: 0 0 8px rgba(255,80,113,0.4);
      animation: mic-pulse 1.2s ease-in-out infinite;
    }
    @keyframes mic-pulse {
      0%,100% { box-shadow: 0 0 8px rgba(255,80,113,0.4); }
      50% { box-shadow: 0 0 16px rgba(255,80,113,0.7); }
    }
    .pcard-mic.dead-mic {
      opacity: 0.3; pointer-events: none;
    }
    /* 全局录音FAB */
    .global-rec-wrap {
      display: flex;
      justify-content: center;
      margin: 12px 0;
    }
    /* 角色概率条件隐藏 */
    .hidden-panel {
      display: none !important;
    }
    /* 完整发言弹窗 */
    .full-speech-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,10,0.8);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .full-speech-modal.hidden {
      display: none;
    }
    .full-speech-content {
      width: min(100%, 400px);
      max-height: 70vh;
      background: #0e2145;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 16px;
      overflow-y: auto;
    }
    .full-speech-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #c8d8f8;
    }
    .full-speech-close {
      background: transparent;
      border: 0;
      color: var(--subtext);
      font-size: 18px;
      cursor: pointer;
    }
    .full-speech-item {
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      font-size: 12px;
      line-height: 1.6;
      color: #dde8ff;
    }
    .full-speech-empty {
      color: var(--subtext);
      font-size: 13px;
      text-align: center;
      padding: 20px 0;
    }
    .divider {
      height: 1px;
      background: var(--line);
      margin: 10px 0;
    }
    /* 三板块样式 */
    .three-blocks {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .three-blocks .block-claim,
    .three-blocks .block-eval,
    .three-blocks .block-expect {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
    }
    .three-blocks .block-claim {
      background: rgba(255,188,45,0.08);
      border-left: 3px solid #ffbc2d;
    }
    .three-blocks .block-eval {
      background: rgba(100,180,255,0.08);
      border-left: 3px solid #64b4ff;
    }
    .three-blocks .block-expect {
      background: rgba(255,100,80,0.08);
      border-left: 3px solid #ff6450;
    }
    .three-blocks .block-label {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .block-claim .block-label { color: #ffbc2d; }
    .block-eval .block-label { color: #64b4ff; }
    .block-expect .block-label { color: #ff6450; }
    .three-blocks .block-text {
      color: #dde8ff;
      word-break: break-all;
    }
  </style>
</head>
<body>
<div class="phone">
  <main class="page">

    <!-- 顶部状态栏 -->
    <header class="headbar">
      <div class="status-chip">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">实时分析</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="timer" id="timerText">00:00:00</span>
        <button class="link-danger" id="endGameBtn" style="border:0;background:transparent;cursor:pointer;font-size:14px;font-weight:700;color:#ff4469;">结束对局</button>
      </div>
    </header>

    <!-- 天数导航 -->
    <div class="day-nav" id="dayNav">
      <button class="day-chip active" data-day="1">第1天</button>
      <button class="day-chip add-btn" id="addDayBtn">+ 下一天</button>
    </div>

    <!-- 配置栏 -->
    <section class="config-panel">
      <div class="config-row">
        <span class="config-label">游戏模式：</span>
        <span id="gameModeLabel" style="font-size:13px;color:#d0e0ff;font-weight:700;">12人标准局</span>
      </div>
      <div class="config-row">
        <span class="config-label">我的身份：</span>
        <select id="myRoleSelect" class="role-select">
          <option value="未知">未知</option>
          <option value="狼人">狼人</option>
          <option value="预言家">预言家</option>
          <option value="女巫">女巫</option>
          <option value="猎人">猎人</option>
          <option value="守卫">守卫</option>
          <option value="平民">平民</option>
          <option value="狼王">狼王</option>
        </select>
      </div>
      <div class="config-row">
        <span class="config-label">我是：</span>
        <span id="mySeatLabel" style="font-size:13px;color:#ffbc2d;font-weight:700;">1号位</span>
      </div>
      <div class="config-row">
        <span class="config-label">当前阶段：</span>
        <select id="phaseSelect" class="role-select">
          <option value="白天发言">白天发言</option>
          <option value="投票">投票阶段</option>
          <option value="夜晚">夜晚行动</option>
          <option value="遗言">遗言阶段</option>
        </select>
      </div>
    </section>

    <!-- Tab 分页导航 -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="speech">发言记录</button>
      <button class="tab-btn" data-tab="analysis">AI分析</button>
      <button class="tab-btn" data-tab="data">数据面板</button>
    </div>

    <!-- ========== Tab 1: 发言记录 ========== -->
    <div class="tab-panel active" id="tab-speech">
      <!-- 玩家卡片网格 -->
      <div id="speechList" class="pcard-grid"></div>

      <div class="hint" id="hintText">点击玩家麦克风开始录音，安静后自动识别保存。</div>
      <div class="hint wait" id="queueText"></div>
      <div style="display:flex;gap:8px;margin-top:8px;justify-content:center;flex-wrap:wrap;">
        <button id="speechAdviceBtn" class="vote-add-btn" style="background:rgba(255,188,45,0.12);border-color:rgba(255,188,45,0.5);color:#ffbc2d;">💡 AI话术推荐</button>
        <button id="roleAnalysisBtn" class="vote-add-btn" style="background:rgba(150,80,255,0.12);border-color:rgba(150,80,255,0.5);color:#c39eff;">🧠 AI分析</button>
        <button id="roundSummaryBtn" class="vote-add-btn" style="background:rgba(37,208,143,0.12);border-color:rgba(37,208,143,0.5);color:#25d08f;">🔄 回合总结</button>
        <button id="voteAdviceBtn" class="vote-add-btn" style="background:rgba(255,100,80,0.12);border-color:rgba(255,100,80,0.5);color:#ff6450;">🗳️ 投票建议</button>
      </div>
    </div>

    <!-- ========== Tab 2: AI分析 ========== -->
    <div class="tab-panel" id="tab-analysis">
      <!-- AI分析总结 -->
      <section class="panel">
        <div class="panel-title"><span class="title-icon">🧠</span> AI分析总结</div>
        <div class="panel-main" id="aiSummaryText">等待分析数据...</div>
        <div id="mindMapArea" style="margin-top:10px;"></div>
      </section>

      <!-- 投票建议 -->
      <section class="panel">
        <div class="panel-title"><span class="title-icon">🗺️</span> 投票建议</div>
        <div class="panel-main" id="voteAdviceText">等待分析...</div>
        <ul class="plain-list" id="votePointsList"></ul>
      </section>

      <!-- 话术模板 -->
      <section class="panel">
        <div class="panel-title"><span class="title-icon">💬</span> 话术模板（点击复制）</div>
        <div class="speech-tabs">
          <button class="speech-tab active" data-type="defense">防御</button>
          <button class="speech-tab" data-type="attack">进攻</button>
          <button class="speech-tab" data-type="tablewater">表水</button>
          <button class="speech-tab" data-type="identity">特定身份</button>
        </div>
        <div class="speech-content" id="speechContent">等待AI分析后生成话术模板...</div>
        <button class="speech-copy-btn" id="copySpeechBtn">📋 复制话术</button>
      </section>

    </div>

    <!-- ========== Tab 3: 数据面板 ========== -->
    <div class="tab-panel" id="tab-data">
      <!-- 狼人概率预测（非狼人时显示） -->
      <section class="panel" id="wolfProbPanel">
        <div class="panel-title"><span class="title-icon">📊</span> 狼人概率预测</div>
        <div id="probabilityChart" class="prob-chart">
          <div style="color:var(--subtext);font-size:12px;">等待分析数据...</div>
        </div>
      </section>

      <!-- 角色概率明细 -->
      <section class="panel">
        <div class="panel-title"><span class="title-icon">🎯</span> 角色概率明细</div>
        <div id="roleMatrix" class="role-matrix">
          <div style="color:var(--subtext);font-size:12px;">等待分析数据...</div>
        </div>
      </section>

      <!-- 投票记录 -->
      <section class="panel">
        <div class="panel-title"><span class="title-icon">🗳️</span> 投票记录</div>
        <div id="voteRecordList">
          <div style="color:var(--subtext);font-size:12px;">暂无投票记录</div>
        </div>
        <div class="vote-add-row" id="voteAddArea">
          <select class="vote-add-select" id="voteFrom">
            <option value="">投票者</option>
          </select>
          <select class="vote-add-select" id="voteTo" style="max-width:80px;">
            <option value="">投</option>
          </select>
          <button class="vote-add-btn" id="voteAddBtn">记录</button>
        </div>
      </section>

      <!-- 数据面板AI分析 -->
      <section class="panel">
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 0;">
          <button id="dataPanelAnalysisBtn" class="vote-add-btn" style="background:rgba(100,180,255,0.12);border-color:rgba(100,180,255,0.5);color:#64b4ff;">📊 AI分析数据面板</button>
        </div>
      </section>
    </div>

  </main>

  <!-- 完整发言弹窗 -->
  <div class="full-speech-modal hidden" id="fullSpeechModal">
    <div class="full-speech-content">
      <div class="full-speech-title">
        <span id="fullSpeechTitle">玩家完整发言</span>
        <button class="full-speech-close" id="fullSpeechClose">✕</button>
      </div>
      <div id="fullSpeechList"></div>
    </div>
  </div>

  <nav class="footer-nav" style="grid-template-columns: repeat(3, 1fr);">
    <div onclick="window.location.href='/index.html'">🏠 首页</div>
    <div class="active">🎮 对局</div>
    <div onclick="window.location.href='/game-over.html'">🏁 结束</div>
  </nav>
</div>

<script src="/assets/analysis.js"></script>
</body>
</html>
